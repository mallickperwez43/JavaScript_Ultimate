<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link href="85_style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="conatiner">
        <!-- This header groups the title and dark mode toggle -->
        <div class="header">
            <h1>Password Generator</h1>
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="background-toggle">
                    <span class="slider round"></span>
                </label>
                <p>Dark Mode</p>
            </div>
        </div>

        <!-- Inputs and controls are stacked vertically -->
        <div class="controls-container">
            <div class="input-group">
                <label for="Password-length">Password Length:</label>
                <input type="number" id="password-length" value="4" min="4" max="30">
            </div>

            <div class="input-group">
                <label for="password-type">Password Type:</label>
                <select id="password-type">
                    <option value="strong">Strong Password</option>
                    <option value="weak">Weak Password</option>
                    <option value="super-strong">Super Strong Password</option>
                    <option value="funny">Funny Password</option>
                </select>
            </div>
        </div>

        <!-- Button to perform the JS logic -->
        <button id="generate-btn">Generate Password</button>

        <!-- This container is used to display the password -->
        <div class="password-display">
            <h2 id="password-output"></h2>
        </div>
    </div>
    <script src="85_Exercise7.js"></script>
</body>

</html>
