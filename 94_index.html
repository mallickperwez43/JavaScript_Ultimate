<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise_8</title>
    <link href="94_style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="main-container">
        <div class="date-container">
            <h1 id="current-time">00:00:00 AM</h1>

            <button id="theme-toggle">Dark Mode</button>

            <div id="alarm-controls">
                <label for="alarm-time">Set Alarm</label>
                <input type="time" id="alarm-time" required>
                <button id="set-alarm-btn">Set Alarm</button>
                <button id="stop-alarm-btn" disabled>Stop Alarm</button>
            </div>
            <audio id="alarm-audio" loop preload="auto" src="alarm.mp3"></audio>
        </div>
    </div>
    <script src="94_Exercise8.js"></script>
</body>

</html>
